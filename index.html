<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">

    <title>Class 10 Science - Mega Quiz</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        h2 { text-align: center; color: #2c3e50; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        .options-container { display: flex; flex-direction: column; gap: 8px; }
        .option-label {
            display: flex; align-items: center; padding: 10px 15px;
            background-color: #f8f9fa; border: 1px solid #dee2e6; border-radius: 5px;
            cursor: pointer; transition: 0.2s; font-size: 15px;
        }

        /* Select karne par rang */
        .selected-opt { background-color: #d1ecf1; border-color: #bee5eb; }
        
        /* Submit ke baad ke rang (Sahi aur Galat) */
        .correct-opt { background-color: #d4edda !important; border-color: #c3e6cb !important; color: #155724; font-weight: bold; }
        .wrong-opt { background-color: #f8d7da !important; border-color: #f5c6cb !important; color: #721c24; text-decoration: line-through; }

        /* Buttons aur Score Card */
        .submit-btn { background-color: #e67e22; color: white; border: none; padding: 15px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; font-size: 18px; margin-top: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .submit-btn:hover { background-color: #d35400; }
        
        .score-card { display: none; background-color: #2ecc71; color: white; text-align: center; padding: 20px; border-radius: 8px; margin-bottom: 20px; font-size: 22px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>

        "33": "c", "34": "a", "35": "b", "36": "a", "37": "d", "38": "a", "39": "d", "40": "b",
        "41": "b", "42": "b", "43": "c", "44": "b", "45": "c", "46": "b", "47": "b", "48": "c",

    function renderMCQs() {
        const container = document.getElementById('mcq-container');
        const questions = mcqData.trim().split(/\n(?=\d+\.)/); 
        
        questions.forEach(q => {
            let cleanText = q.trim();
            if(!cleanText) return;
            
            let qNumMatch = cleanText.match(/^(\d+)\./);
            let qNum = qNumMatch ? qNumMatch[1] : "";

            let firstOptIndex = cleanText.search(/\((a|b|c|d)\)/);
            let questionText = cleanText;
            let optionsHTML = "";

            if(firstOptIndex !== -1) {
                questionText = cleanText.substring(0, firstOptIndex).trim();
                let optionsPart = cleanText.substring(firstOptIndex);
                
                let optRegex = /\((a|b|c|d)\)\s*([\s\S]*?)(?=\((a|b|c|d)\)|$)/g;
                optionsHTML = optionsPart.replace(optRegex, function(match, optKey, optValue) {
                    return `<label class="option-label" onclick="selectOption(this)">
                                <input type="radio" name="q${qNum}" value="${optKey}"> 
                                <strong>(${optKey})</strong>&nbsp;${optValue.trim()}
                            </label>`;
                });
            }

            let cardHTML = `
                <div class="qa-card" data-qnum="${qNum}">
                    <div class="q-text">${questionText}</div>
                    <div class="options-container">${optionsHTML}</div>
                </div>
            `;
            container.innerHTML += cardHTML;
        });
    }

    window.selectOption = function(label) {
        let input = label.querySelector('input');
        if(input.disabled) return; 
        
        input.checked = true;
        let allLabels = label.parentElement.querySelectorAll('.option-label');
        allLabels.forEach(l => l.classList.remove('selected-opt'));
        label.classList.add('selected-opt');
    };

    window.calculateScore = function() {
        let score = 0;
        let total = 0;
        const allCards = document.querySelectorAll('.qa-card');
        
        allCards.forEach(card => {
            total++;
            const qNum = card.getAttribute('data-qnum');
            let correctOpt = mcqAnswers[qNum]; 
            
            if(correctOpt) {
                correctOpt = correctOpt.trim().toLowerCase();
            }

            const selectedRadio = card.querySelector('input[type="radio"]:checked');
            let correctRadio = null;
            const allRadios = card.querySelectorAll('input[type="radio"]');
            
            allRadios.forEach(r => {
                if(correctOpt && r.value.trim().toLowerCase() === correctOpt) {
                    correctRadio = r;
                }
                r.disabled = true; 
            });

            card.querySelectorAll('.option-label').forEach(l => l.style.cursor = "default");

            if(correctRadio) {
                correctRadio.parentElement.classList.add('correct-opt');
            }

            if(selectedRadio) {
                if(correctOpt && selectedRadio.value.trim().toLowerCase() === correctOpt) {
                    score++; 
                } else {
                    selectedRadio.parentElement.classList.add('wrong-opt');
                }
            }
        });

        const finalScore = score + " / " + total;
        const scoreCard = document.getElementById('score-card');
        scoreCard.innerHTML = `🏆 आपका स्कोर: ${finalScore}`;
        scoreCard.style.display = 'block';
        
        document.getElementById('submit-btn').style.display = 'none'; 
        window.scrollTo({ top: 0, behavior: 'smooth' });

        const formData = new FormData();
        formData.append("form-name", "StudentScores");
        formData.append("Student_Name", "Class 10 Student");
        formData.append("Score", finalScore);

        fetch("/", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: new URLSearchParams(formData).toString()
        }).catch((error) => console.log(error));
    }

    renderMCQs();
</script>
</body>
</html>
